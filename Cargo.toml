[package]
name = "mail2tg"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["tevarindol"]
repository = "https://github.com/tevarindol/mail2tg"

[package.metadata.release]
release = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
mail-parser = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
worker = "0.8.7"
